    <script>
      // Gracefully prevent unhandled WebSocket rejection banners and errors in preview environment
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.reason || String(msg));
          return /websocket|vite-hmr|vite-ping|closed without opened/i.test(str);
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
            return true;
          }
        }, true);

        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : a))) || '';
          }).join(' ');

          if (isWsError(joined)) {
            console.debug.apply(console, ['[Ignored WebSocket Notice]:'].concat(args));
            return;
          }
          originalConsoleError.apply(console, args);
        };
      })();
    </script>
